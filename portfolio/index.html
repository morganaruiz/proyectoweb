<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/portfolio.css" />

    <!-- Meta Tags SEO Las meta tags SEO son fragmentos de código HTML 
     que se encuentran en la cabecera de una página web y que proporcionan 
     información sobre su contenido a los motores de búsqueda y a los usuarios. 
     Son fundamentales para el SEO porque ayudan a los buscadores a entender y 
     clasificar el contenido de la página, influyendo en su posicionamiento en 
     los resultados de búsqueda. Aunque no son visibles para el usuario en la 
     página, se utilizan para generar el fragmento (snippet) que aparece en los resultados de búsqueda. -->
    <title>
      Nombre Apellido - Desarrollador Web Profesional | Portafolio Bootstrap
    </title>
    <meta
      name="description"
      content="Desarrollador web profesional especializado en diseño responsivo, frameworks CSS modernos, e interfaces de usuario accesibles. Portafolio mostrando proyectos Bootstrap y habilidades de desarrollo front-end."
    />
    <meta
      name="keywords"
      content="desarrollador web, desarrollador bootstrap, diseño responsivo, desarrollador front-end, portafolio"
    />
    <meta name="author" content="Nombre Apellido" />

    <!-- Open Graph Open Graph es un protocolo de etiquetas HTML que permite 
     a los sitios web controlar cómo se muestra el contenido al ser compartido 
     en redes sociales, utilizando un título, una descripción, una imagen y la 
     URL. Al implementar estas etiquetas, se asegura que la vista previa del 
     enlace sea atractiva e informativa, en lugar de que la red social elija 
     la información al azar. -->
    <meta
      property="og:title"
      content="Nombre Apellido - Desarrollador Web Profesional"
    />
    <meta
      property="og:description"
      content="Portafolio mostrando proyectos Bootstrap responsivos y habilidades de desarrollo web moderno."
    />
    <meta
      property="og:image"
      content="https://johndoe-portfolio.com/assets/images/og-image.jpg"
    />
    <meta property="og:url" content="https://johndoe-portfolio.com" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Precarga de recursos críticos -->
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      as="style"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <!-- Bootstrap CSS  Framework comprehensivo para construir aplicaciones web responsivas y mobile-first.
     Proporciona una colección comprehensiva de clases CSS, componentes JavaScript, y patrones de diseño 
     que ayudan a los desarrolladores a crear sitios web consistentes y profesionales rápidamente-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS personalizado -->
    <link href="/assets/css/custom.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Tu contenido aquí -->

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
